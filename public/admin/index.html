<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Content Manager — Orange Neptune</title>
  </head>
  <body>
    <!-- Sveltia CMS: a lightweight, drop-in content editor that commits to GitHub. -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>

    <!--
      Make the right-hand Preview pane read like the published article:
      serif body, styled headings, quotes and lists, using the site's colours.
      (Sveltia supports registerPreviewStyle; full custom templates aren't yet.)
    -->
    <script>
      (function () {
        var previewCss = [
          "body{color:oklch(0.18 0.03 260);padding:1.5rem 2rem;}",
          "h1,h2,h3,h4{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:700;letter-spacing:-0.01em;line-height:1.25;color:oklch(0.18 0.03 260);}",
          "h1{font-size:1.9rem;margin:0 0 .5rem;}",
          "h2{font-size:1.5rem;margin:2rem 0 .75rem;}",
          "h3{font-size:1.25rem;margin:1.6rem 0 .5rem;}",
          "p,li,blockquote{font-family:Georgia,Cambria,'Times New Roman',serif;font-size:1.08rem;line-height:1.8;color:oklch(0.32 0.03 260);}",
          "p{margin:0 0 1.1rem;}",
          "strong{color:oklch(0.18 0.03 260);font-weight:700;}",
          "a{color:oklch(0.62 0.14 240);text-decoration:underline;text-underline-offset:2px;}",
          "ul,ol{padding-left:1.5rem;margin:0 0 1.1rem;}",
          "ul{list-style:disc;}ol{list-style:decimal;}",
          "li{margin:.35rem 0;}",
          "blockquote{border-left:3px solid oklch(0.62 0.14 240);margin:1.25rem 0;padding:.25rem 0 .25rem 1.1rem;font-style:italic;color:oklch(0.18 0.03 260);}",
          "img{max-width:100%;height:auto;border-radius:.6rem;border:1px solid oklch(0.92 0.02 235);}",
          "hr{border:none;border-top:1px solid oklch(0.92 0.02 235);margin:2rem 0;}",
          "code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;background:oklch(0.97 0.02 235);padding:.1em .35em;border-radius:.3rem;}",
        ].join("");

        var attempts = 0;
        (function register() {
          if (window.CMS && typeof window.CMS.registerPreviewStyle === "function") {
            window.CMS.registerPreviewStyle(previewCss, { raw: true });
          } else if (attempts++ < 200) {
            setTimeout(register, 50);
          }
        })();
      })();
    </script>
  </body>
</html>
